{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block page_title %}Forgot password{% endblock %}
{% block content %}
<p>Enter the email on the login. If it belongs to an account, a set-password link is sent there.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send link</button>
</form>
{% endblock %}
