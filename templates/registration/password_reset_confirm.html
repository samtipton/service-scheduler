{% extends "base.html" %}
{% block title %}Set password{% endblock %}
{% block content %}
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Set password</button>
</form>
{% else %}
<p>This link is invalid or has already been used. Request a new one.</p>
{% endif %}
{% endblock %}
